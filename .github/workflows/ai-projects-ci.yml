name: AI projects - tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  faro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: faro-ops/requirements.txt
      - name: Install dependencies
        run: pip install -r faro-ops/requirements.txt
      - name: FARO tests
        working-directory: faro-ops
        run: pytest -q
  orion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: orion-knowledge/requirements.txt
      - name: Install dependencies
        run: pip install -r orion-knowledge/requirements.txt
      - name: ORION tests
        working-directory: orion-knowledge
        run: pytest -q
